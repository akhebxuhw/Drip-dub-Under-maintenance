<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Drip Hub · Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html[data-theme=light]{--bg:#eef1f8;--fg:#0e0f14;--mut:#6b6f7b;--line:rgba(20,24,40,.12);--acc:#111;--accfg:#fff;
  --g1:rgba(255,255,255,.34);--g2:rgba(255,255,255,.07);--gspec:rgba(255,255,255,.55);--ghi:rgba(255,255,255,.95);--glo:rgba(20,30,60,.10);--gedge:rgba(255,255,255,.9);--gedge2:rgba(255,255,255,.5);--gin:rgba(255,255,255,.22);--gsh:rgba(40,50,90,.18);--grim:rgba(255,255,255,1);--grim2:rgba(80,100,160,.22);--gb:24px;--gbr:1.06}
html[data-theme=dark]{--bg:#000;--fg:#f4f4f7;--mut:#9a9aa6;--line:rgba(255,255,255,.16);--acc:linear-gradient(135deg,#f6f6f8,#a4a4ae);--accfg:#111;
  --g1:rgba(255,255,255,.13);--g2:rgba(255,255,255,.025);--gspec:rgba(255,255,255,.16);--ghi:rgba(255,255,255,.5);--glo:rgba(255,255,255,.07);--gedge:rgba(255,255,255,.38);--gedge2:rgba(255,255,255,.14);--gin:rgba(255,255,255,.06);--gsh:rgba(0,0,0,.6);--grim:rgba(255,255,255,.85);--grim2:rgba(255,255,255,.26);--gb:26px;--gbr:1.25}
body{font-family:'Space Grotesk','Cairo',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;transition:background .5s,color .5s;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html[lang=ar] body{font-family:'Cairo','Space Grotesk',sans-serif}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;will-change:transform;animation:aurora 30s ease-in-out infinite alternate;background:radial-gradient(38% 34% at 18% 22%,rgba(110,150,255,.40),transparent 70%),radial-gradient(34% 34% at 82% 28%,rgba(255,140,200,.30),transparent 70%),radial-gradient(40% 40% at 62% 86%,rgba(100,230,200,.32),transparent 70%)}
html[data-theme=dark] body::before{background:radial-gradient(38% 34% at 20% 20%,rgba(255,255,255,.07),transparent 70%),radial-gradient(34% 34% at 85% 30%,rgba(160,170,200,.07),transparent 70%),radial-gradient(40% 40% at 60% 88%,rgba(255,255,255,.05),transparent 70%)}
@keyframes aurora{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity .9s;pointer-events:none}
html[data-theme=dark] #stars{opacity:1}
.top,.hero{position:relative;z-index:1}

.glass{position:relative;isolation:isolate;background:radial-gradient(120% 90% at 0% 0%,var(--gspec),transparent 58%),linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(var(--gb)) saturate(220%) brightness(var(--gbr));backdrop-filter:blur(var(--gb)) saturate(220%) brightness(var(--gbr));
  box-shadow:inset 0 1px .5px var(--ghi),inset 0 -1px .5px var(--glo),inset 2px 3px 4px -2px var(--gedge),inset -2px -3px 4px -2px var(--gedge2),inset 0 0 26px var(--gin),0 1px 2px rgba(0,0,0,.06),0 20px 50px var(--gsh)}
.glass.lite{-webkit-backdrop-filter:none;backdrop-filter:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:3;
  background:conic-gradient(from calc(210deg + var(--spin,0deg)),var(--grim),transparent 22%,var(--grim2) 50%,transparent 72%,var(--grim));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.msg::after{animation:spin 10s linear infinite}
@keyframes spin{to{--spin:360deg}}

.top{position:sticky;top:10px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 3vw 0;padding:9px 12px 9px 24px;border-radius:999px}
.logo{font-weight:700;font-size:22px;letter-spacing:3px;position:relative;z-index:1}
.logo span{margin-inline-start:4px;opacity:.55}
html[data-theme=dark] .logo span{background:var(--acc);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:1}
.tools{display:flex;gap:8px;position:relative;z-index:1}
.pill{min-width:42px;height:42px;padding:0 14px;border-radius:999px;border:none;cursor:pointer;display:grid;place-items:center;position:relative;overflow:hidden;background:transparent;transition:transform .35s var(--spring)}
.pill:hover{transform:scale(1.08)}
.pill:active{transform:scale(.9)}
.ico{display:inline-block;font-size:18px;transition:transform .6s var(--ease);position:relative;z-index:1}
#themeBtn:hover .ico{transform:rotate(180deg) scale(1.2)}

.hero{min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 5vw 80px}
.eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:13px;color:var(--mut);margin-bottom:10px;animation:fade 1s .2s both}
h1{font-size:clamp(70px,19vw,230px);line-height:.88;font-weight:700;letter-spacing:-4px;direction:ltr}
.w{display:block}
.l{display:inline-block;animation:rise 1s var(--ease) both;animation-delay:var(--d);transition:transform .4s var(--ease)}
.l:hover{transform:translateY(-14px) rotate(-6deg)}
.out .l{color:transparent;-webkit-text-stroke:2px var(--fg)}
html[data-theme=dark] .out .l{-webkit-text-stroke:2px #c8c8d0;filter:drop-shadow(0 0 12px rgba(255,255,255,.35))}
.msg{margin-top:38px;padding:22px 30px 24px;border-radius:32px;max-width:520px;width:100%;display:grid;gap:14px;justify-items:center;animation:fade 1s 1s both}
.msg>*{position:relative;z-index:1}
.gear{width:46px;height:46px;stroke:var(--fg);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:turn 6s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.msg h2{font-size:clamp(22px,4.5vw,30px)}
.msg p{color:var(--mut);line-height:1.7}
.bar{width:100%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:inherit;background:var(--acc);animation:slide 2.2s var(--ease) infinite}
html[dir=rtl] .bar i{animation-name:slideR}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
@keyframes slideR{from{transform:translateX(110%)}to{transform:translateX(-260%)}}
@keyframes rise{from{transform:translateY(110%) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:vt .9s ease-in-out both;z-index:9999}
@keyframes vt{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150vmax at var(--vx,50%) var(--vy,0))}}
@media(max-width:700px){.logo{font-size:18px;letter-spacing:2px}.pill{padding:0 10px;min-width:38px;height:38px}.top{padding:7px 8px 7px 18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header class="top glass">
  <a class="logo" href="#">DRIP<span>HUB</span></a>
  <div class="tools">
    <button id="langBtn" class="pill glass lite">عربي</button>
    <button id="themeBtn" class="pill glass lite" aria-label="Theme"><span class="ico">☾</span></button>
  </div>
</header>

<section class="hero">
  <p class="eyebrow" id="eyebrow">Authentic brands · Street ready</p>
  <h1><span class="w">DRIP</span><span class="w out">HUB</span></h1>
  <div class="msg glass">
    <svg class="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></svg>
    <h2 id="title">Under maintenance</h2>
    <p id="text">We are working on something new. We will be back very soon.</p>
    <div class="bar"><i></i></div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), root = document.documentElement;
const T = {
  en: { eyebrow: 'Authentic brands · Street ready', title: 'Under maintenance', text: 'We are working on something new. We will be back very soon.', btn: 'عربي' },
  ar: { eyebrow: 'ماركات أصلية · جاهزة للشارع', title: 'الموقع تحت الصيانة', text: 'نشتغل على شيء جديد. راجعين لكم قريباً جداً.', btn: 'English' }
};
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; };
let theme = ls('dh_theme') === 'dark' ? 'dark' : 'light', lang = ls('dh_lang') === 'ar' ? 'ar' : 'en';

/* letters */
document.querySelectorAll('.w').forEach((w, wi) => { w.innerHTML = [...w.textContent].map((ch, i) => `<span class="l" style="--d:${wi * 350 + i * 90}ms">${ch}</span>`).join(''); });

/* stars (dark mode only) */
const cv = $('#stars'), cx = cv.getContext('2d'), sprite = document.createElement('canvas');
sprite.width = sprite.height = 64;
(() => { const g = sprite.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.12, 'rgba(255,255,255,.95)'); gr.addColorStop(.25, 'rgba(205,205,212,.45)'); gr.addColorStop(1, 'rgba(160,160,170,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); })();
let W, H, stars = [], raf = 0, mx = -9999, my = -9999;
function size() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({ length: Math.min(190, Math.floor(W * H / 9000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * .9 + .1, r: Math.random() * 1.4 + .4, p: Math.random() * 6.28, s: Math.random() * .003 + .001, vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15 }));
}
function loop(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of stars) {
    s.x += s.vx * s.z; s.y += s.vy * s.z;
    if (s.x < -10) s.x = W + 10; if (s.x > W + 10) s.x = -10;
    if (s.y < -10) s.y = H + 10; if (s.y > H + 10) s.y = -10;
    let px = s.x, py = s.y, boost = 0;
    const dx = px - mx, dy = py - my, d = Math.sqrt(dx * dx + dy * dy) || 1;
    if (d < 150) { boost = 1 - d / 150; px += dx / d * boost * 14; py += dy / d * boost * 14; }
    const tw = .5 + .5 * Math.sin(t * s.s * 6 + s.p), a = Math.min(1, .2 + tw * .6 * s.z + boost), r = s.r * (1 + boost * 1.6) * (.65 + tw * .5);
    cx.globalAlpha = a; cx.drawImage(sprite, px - r * 4, py - r * 4, r * 8, r * 8);
  }
  raf = requestAnimationFrame(loop);
}
const starsOn = on => { if (on && !raf) raf = requestAnimationFrame(loop); if (!on && raf) { cancelAnimationFrame(raf); raf = 0; } };
addEventListener('resize', size);
addEventListener('pointermove', e => { if (e.pointerType !== 'touch') { mx = e.clientX; my = e.clientY; } }, { passive: true });
document.addEventListener('visibilitychange', () => starsOn(!document.hidden && theme === 'dark'));

/* theme + language */
function applyTheme() { root.dataset.theme = theme; ls('dh_theme', theme); $('#themeBtn .ico').textContent = theme === 'dark' ? '☀' : '☾'; starsOn(theme === 'dark'); }
function applyLang() {
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr'; ls('dh_lang', lang);
  $('#eyebrow').textContent = T[lang].eyebrow; $('#title').textContent = T[lang].title; $('#text').textContent = T[lang].text; $('#langBtn').textContent = T[lang].btn;
}
$('#themeBtn').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  root.style.setProperty('--vx', (r.left + r.width / 2) + 'px'); root.style.setProperty('--vy', (r.top + r.height / 2) + 'px');
  theme = theme === 'dark' ? 'light' : 'dark';
  document.startViewTransition ? document.startViewTransition(applyTheme) : applyTheme();
});
$('#langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'ar' : 'en'; applyLang(); });

size(); applyTheme(); applyLang();
})();
</script>
</body>
</html>
